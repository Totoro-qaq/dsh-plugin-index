name: Merge checked release index

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Exact successful candidate verification run to revalidate'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: index-checked-release-merge
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.repository == 'Totoro-qaq/dsh-plugin-index' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Wait for the notifying verification run to finish successfully
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_RUN_ID: ${{ inputs.run_id }}
        shell: bash
        run: |
          [[ "$VERIFY_RUN_ID" =~ ^[1-9][0-9]{0,15}$ ]] || exit 1
          timeout 55s gh run watch "$VERIFY_RUN_ID" --repo Totoro-qaq/dsh-plugin-index --interval 5 --exit-status
      - name: Revalidate and merge only the checked candidate SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: node src/automation-cli.mjs merge
