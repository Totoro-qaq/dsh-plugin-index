name: Sync published plugin releases

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: index-published-releases
  cancel-in-progress: false

jobs:
  propose:
    if: github.repository == 'Totoro-qaq/dsh-plugin-index' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Propose exact published releases and dispatch candidate checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: node src/automation-cli.mjs propose
